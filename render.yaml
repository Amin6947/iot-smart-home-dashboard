# Render Blueprint — deploy backend + Postgres ด้วยคลิกเดียว
# วิธีใช้: เชื่อม repo นี้กับ Render แล้วเลือก "New +" -> "Blueprint"
# Render จะอ่านไฟล์นี้แล้วสร้าง web service + database ให้อัตโนมัติ
services:
  - type: web
    name: iot-dashboard-backend
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true          # Render สุ่มค่าให้อัตโนมัติ ไม่ต้องตั้งเอง
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false                  # ต้องไปตั้งเองใน Render dashboard (ห้าม commit ลง git)
      - key: DEVICE_API_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false                  # ใส่ URL จริงของ frontend หลัง deploy Vercel เสร็จ
      - key: DATABASE_URL
        fromDatabase:
          name: iot-dashboard-db
          property: connectionString

databases:
  - name: iot-dashboard-db
    plan: free
    databaseName: iot_dashboard
    user: iot_dashboard
